name: Actualizar Song Tracker desde setlist.fm

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-setlists:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Revisar conciertos BTS en setlist.fm
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: node scripts/update-setlists.mjs

      - name: Guardar cambios si hay un setlist nuevo o corregido
        run: |
          if git diff --quiet -- data/setlists.json; then
            echo "Sin cambios de setlists."
            exit 0
          fi

          git config user.name "BTS Chile Auto Update"
          git config user.email "actions@users.noreply.github.com"

          git add data/setlists.json
          git commit -m "Actualiza Song Tracker desde setlist.fm"
          git push
